[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis"
version = "0.1.0"
description = "Evidence-Driven Agentic Intelligence System for construction documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy",
    "psycopg[binary]",
    "pgvector",
    "alembic",
    "redis",
]

[project.optional-dependencies]
ingestion = ["pymupdf"]
agents = ["langgraph"]
dev = ["pytest", "httpx", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
