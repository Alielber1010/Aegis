services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aegis}
      POSTGRES_DB: ${POSTGRES_DB:-aegis}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aegis}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    env_file: [{ path: .env, required: false }]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: { context: ., dockerfile: infra/docker/Dockerfile }
    env_file: [{ path: .env, required: false }]
    command: ["python", "-m", "aegis.worker"]
    depends_on: [db, redis]
    profiles: ["worker"]   # enable once the worker exists: docker compose --profile worker up

volumes:
  pgdata:
